[package]
name = "yoonspace"
version = "0.1.0"
description = "YoonSpace - A lightweight browser for Engineers"
authors = ["yamada"]
license = "GPL-3.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "yoonspace_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-log = "2"
sysinfo = "0.33"
dirs = "6.0"
url = "2.5"
adblock = { git = "https://github.com/brave/adblock-rust", branch = "master", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_34"] }
javascriptcore = { version = "1.1", package = "javascriptcore-rs" }
libc = "0.2"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"

[profile.dev.package."*"]
opt-level = 3

