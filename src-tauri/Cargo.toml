[package]
name = "yoonspace"
version = "0.1.0"
description = "YoonSpace - A lightweight browser for Engineers"
authors = ["yamada"]
license = "GPL-3.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "yoonspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-log = "2"
sysinfo = "0.33"
dirs = "6.0"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_34"] }
libc = "0.2"

